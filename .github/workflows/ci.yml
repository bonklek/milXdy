name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out pinned Post-reading SDK reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bonklek/post-reading
          ref: 10febd3b62616138ba18a6c198d74009af09fd46
          path: post-reading-sdk

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Post-reading reference dependencies
        run: corepack pnpm@11.7.0 --dir post-reading-sdk install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build Chromium
        run: npm run build:chromium

      - name: Build Chromium beta
        run: npm run build:chromium:beta

      - name: Build Firefox
        run: npm run build:firefox

      - name: Verify update checks
        run: npm run verify:update-check

      - name: Verify URL allowlist
        run: npm run verify:url-allowlist

      - name: Verify platform
        run: npm run verify:platform

      - name: Verify App SDK production contract
        run: npm run verify:app-sdk-production

      - name: Verify Pages add-ons catalog
        run: npm run verify:pages-catalog

      - name: Verify local catalog selections
        run: npm run verify:local-addon-selection

      - name: Verify local catalog Prepare and Apply
        run: npm run verify:local-addon-selection-workflow

      - name: Verify external Post-reading App SDK reference
        env:
          POST_READING_REPO: ${{ github.workspace }}/post-reading-sdk
        run: npm run verify:post-reading-sdk-reference
      - name: Verify extension smoke
        run: npm run verify:smoke:020

      - name: Verify app smoke
        run: npm run verify:app-smoke:020

  architecture:
    name: Architecture boundaries and debt ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify architecture boundaries and debt ratchet
        run: npm run verify:architecture
